<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <filter id="feather" x="0" y="0" width="1600" height="1000" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="80" result="shade"/>
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="1" seed="7" result="noise"/>
      <feComposite in="shade" in2="noise" operator="arithmetic" k2="1" k3=".08" k4="-.04" result="dithered"/>
      <feFlood flood-color="#0d151e"/>
      <feComposite in2="dithered" operator="in"/>
    </filter>
  </defs>
  <rect x="385" y="35" width="830" height="930" rx="80" fill-opacity=".88" filter="url(#feather)"/>
</svg>
